name: Notify Slack on Release

on:
  release:
    types: [published]

jobs:
  notify:
    if: ${{ vars.RELEASE_NOTES_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate AI summary and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          script: |
            const releaseBody = context.payload.release.body || '';
            const tagName = context.payload.release.tag_name;
            const releaseName = context.payload.release.name;
            const releaseUrl = context.payload.release.html_url;
            const repo = context.repo;

            const prNumbers = [...releaseBody.matchAll(/#(\d+)/g)]
              .map(m => parseInt(m[1]));

            const prDetails = await Promise.all(
              prNumbers.map(async (num) => {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: repo.owner,
                    repo: repo.repo,
                    pull_number: num
                  });
                  return {
                    number: num,
                    title: pr.title,
                    body: pr.body || ''
                  };
                } catch (e) {
                  return null;
                }
              })
            );

            const validPRs = prDetails.filter(Boolean);

            const prText = validPRs.map(pr =>
              `PR #${pr.number}: ${pr.title}\n${pr.body}`
            ).join('\n\n---\n\n');

            const prompt = `You are a technical writer creating release notes for a mixed audience: development teams, marketing, sales, and customer support staff.

            Below are the PRs from a GitHub release with their titles and descriptions.
            Write a clear, concise bullet point summary from an end-user perspective.

            Guidelines:
            - Write in English
            - Maximum 6 bullets
            - Do not mention PR numbers
            - Focus on user-facing changes and business impact
            - Skip any changes related to dev/staging/development environment updates, CI/CD pipeline changes, test environment configurations, or internal tooling that does not affect end users
            - Use plain language that non-technical readers (marketing, sales, support) can understand — avoid jargon
            - If a change affects a specific feature or area, mention it briefly (e.g. "Checkout flow:", "User profile:")

            ${prText}`;

            const aiResponse = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 500,
                messages: [{ role: 'user', content: prompt }]
              })
            });

            const aiData = await aiResponse.json();
            const summary = aiData.content[0].text;

            await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`
              },
              body: JSON.stringify({
                channel: process.env.SLACK_CHANNEL_ID,
                blocks: [
                  {
                    type: 'header',
                    text: { type: 'plain_text', text: `🚀 ${releaseName || tagName}` }
                  },
                  {
                    type: 'section',
                    text: { type: 'mrkdwn', text: summary }
                  },
                  {
                    type: 'actions',
                    elements: [{
                      type: 'button',
                      text: { type: 'plain_text', text: 'View release' },
                      url: releaseUrl
                    }]
                  }
                ]
              })
            });
