name: Notify Slack on Release

on:
  release:
    types: [published]

jobs:
  notify:
    if: ${{ vars.RELEASE_NOTES_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI summary and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          script: |
            const fs = require('fs');
            const releaseBody = context.payload.release.body || '';
            const tagName = context.payload.release.tag_name;
            const releaseName = context.payload.release.name;
            const releaseUrl = context.payload.release.html_url;
            const repo = context.repo;

            const prNumbers = [...releaseBody.matchAll(/#(\d+)/g)]
              .map(m => parseInt(m[1]));

            const prDetails = await Promise.all(
              prNumbers.map(async (num) => {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: repo.owner,
                    repo: repo.repo,
                    pull_number: num
                  });
                  return {
                    number: num,
                    title: pr.title,
                    body: pr.body || ''
                  };
                } catch (e) {
                  return null;
                }
              })
            );

            const validPRs = prDetails.filter(Boolean);

            let contentText = validPRs.map(pr =>
              `PR #${pr.number}: ${pr.title}\n${pr.body}`
            ).join('\n\n---\n\n');

            if (!contentText) {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: repo.owner,
                repo: repo.repo,
                per_page: 10
              });

              const currentReleaseIndex = releases.findIndex(r => r.tag_name === tagName);
              const previousRelease = releases[currentReleaseIndex + 1];

              console.log(`Current tag: ${tagName}, previous tag: ${previousRelease ? previousRelease.tag_name : 'none'}`);

              if (previousRelease) {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: repo.owner,
                  repo: repo.repo,
                  base: previousRelease.tag_name,
                  head: tagName
                });

                console.log(`Total commits in comparison: ${comparison.commits.length}`);

                const squashCommits = comparison.commits
                  .filter(c => !c.commit.message.startsWith('Merge'));

                console.log(`Squash commits after filtering merges: ${squashCommits.length}`);
                squashCommits.forEach(c => console.log(`  - ${c.commit.message.split('\n')[0]}`));

                const commitEntries = await Promise.all(
                  squashCommits.map(async (c) => {
                    const match = c.commit.message.match(/\(#(\d+)\)/);
                    if (match) {
                      try {
                        const { data: pr } = await github.rest.pulls.get({
                          owner: repo.owner,
                          repo: repo.repo,
                          pull_number: parseInt(match[1])
                        });
                        console.log(`  Fetched PR #${pr.number}: ${pr.title}`);
                        return `PR #${pr.number}: ${pr.title}\n${pr.body || ''}`;
                      } catch (e) {
                        console.log(`  Failed to fetch PR ${match[1]}: ${e.message}`);
                      }
                    }
                    return c.commit.message.split('\n')[0];
                  })
                );

                contentText = commitEntries.filter(e => e && e.trim()).join('\n\n---\n\n');
                console.log(`Final contentText length: ${contentText.length}`);
              }
            }

            if (!contentText) {
              await fetch('https://slack.com/api/chat.postMessage', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`
                },
                body: JSON.stringify({
                  channel: process.env.SLACK_CHANNEL_ID,
                  blocks: [
                    {
                      type: 'header',
                      text: { type: 'plain_text', text: `🚀 ${releaseName || tagName}` }
                    },
                    {
                      type: 'section',
                      text: { type: 'mrkdwn', text: 'No release notes available for this release.' }
                    },
                    {
                      type: 'actions',
                      elements: [{
                        type: 'button',
                        text: { type: 'plain_text', text: 'View release' },
                        url: releaseUrl
                      }]
                    }
                  ]
                })
              });
              return;
            }

            const botInstructions = fs.readFileSync('.github/release-notes-prompt.md', 'utf8');
            const prompt = `${botInstructions}\n\n${contentText}`;

            const aiResponse = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 500,
                messages: [{ role: 'user', content: prompt }]
              })
            });

            const aiData = await aiResponse.json();
            const summary = aiData.content[0].text;

            await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`
              },
              body: JSON.stringify({
                channel: process.env.SLACK_CHANNEL_ID,
                blocks: [
                  {
                    type: 'header',
                    text: { type: 'plain_text', text: `🚀 ${releaseName || tagName}` }
                  },
                  {
                    type: 'section',
                    text: { type: 'mrkdwn', text: summary }
                  },
                  {
                    type: 'actions',
                    elements: [{
                      type: 'button',
                      text: { type: 'plain_text', text: 'View release' },
                      url: releaseUrl
                    }]
                  }
                ]
              })
            });
