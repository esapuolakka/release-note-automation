name: Notify Slack on Release

on:
  release:
    types: [published]

jobs:
  notify:
    if: ${{ vars.RELEASE_NOTES_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI summary and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          script: |
            const fs = require('fs');
            const tagName = context.payload.release.tag_name;
            const releaseName = context.payload.release.name;
            const releaseUrl = context.payload.release.html_url;
            const releaseDate = context.payload.release.published_at;
            const repo = context.repo;

            // Find the previous release to establish the date range
            const { data: releases } = await github.rest.repos.listReleases({
              owner: repo.owner,
              repo: repo.repo,
              per_page: 20
            });
            const currentReleaseIndex = releases.findIndex(r => r.tag_name === tagName);
            const previousRelease = currentReleaseIndex !== -1 ? releases[currentReleaseIndex + 1] : null;
            const previousDate = previousRelease ? previousRelease.published_at : null;

            console.log(`Current release: ${tagName} (${releaseDate})`);
            console.log(`Previous release: ${previousRelease ? previousRelease.tag_name : 'none'} (${previousDate || 'beginning of project'})`);

            // Collect all PRs merged to develop in this release window
            let allPRs = [];
            let page = 1;
            while (true) {
              const { data: prs } = await github.rest.pulls.list({
                owner: repo.owner,
                repo: repo.repo,
                state: 'closed',
                base: 'develop',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
                page
              });
              if (prs.length === 0) break;
              const inRange = prs.filter(pr =>
                pr.merged_at &&
                pr.merged_at <= releaseDate &&
                (!previousDate || pr.merged_at > previousDate)
              );
              allPRs.push(...inRange);
              // Stop if oldest PR on this page was updated before the window starts
              const oldestUpdated = prs[prs.length - 1].updated_at;
              if (previousDate && oldestUpdated < previousDate) break;
              if (prs.length < 100) break;
              page++;
            }

            console.log(`PRs merged to develop in this release: ${allPRs.length}`);
            allPRs.forEach(pr => console.log(`  #${pr.number}: ${pr.title} (merged: ${pr.merged_at})`));

            let contentText = allPRs.map(pr =>
              `PR #${pr.number}: ${pr.title}\n${pr.body || ''}`
            ).join('\n\n---\n\n');

            if (!contentText) {
              console.log('No PRs found in develop — falling back to release body');
              const releaseBody = context.payload.release.body || '';
              if (releaseBody.trim()) contentText = releaseBody.trim();
            }

            if (!contentText) {
              await fetch('https://slack.com/api/chat.postMessage', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`
                },
                body: JSON.stringify({
                  channel: process.env.SLACK_CHANNEL_ID,
                  blocks: [
                    {
                      type: 'header',
                      text: { type: 'plain_text', text: `🚀 ${releaseName || tagName}` }
                    },
                    {
                      type: 'section',
                      text: { type: 'mrkdwn', text: 'No release notes available for this release.' }
                    },
                    {
                      type: 'actions',
                      elements: [{
                        type: 'button',
                        text: { type: 'plain_text', text: 'View release' },
                        url: releaseUrl
                      }]
                    }
                  ]
                })
              });
              return;
            }

            const botInstructions = fs.readFileSync('.github/release-notes-prompt.md', 'utf8');
            const prompt = `${botInstructions}\n\n${contentText}`;

            const aiResponse = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 500,
                messages: [{ role: 'user', content: prompt }]
              })
            });

            const aiData = await aiResponse.json();
            const summary = aiData.content[0].text;

            await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`
              },
              body: JSON.stringify({
                channel: process.env.SLACK_CHANNEL_ID,
                blocks: [
                  {
                    type: 'header',
                    text: { type: 'plain_text', text: `🚀 ${releaseName || tagName}` }
                  },
                  {
                    type: 'section',
                    text: { type: 'mrkdwn', text: summary }
                  },
                  {
                    type: 'actions',
                    elements: [{
                      type: 'button',
                      text: { type: 'plain_text', text: 'View release' },
                      url: releaseUrl
                    }]
                  }
                ]
              })
            });
