name: Test Release Email

on:
  release:
    types: [published]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AI summary
        id: summary
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const release = context.payload.release || {};
            const releaseBody = release.body || '';
            const tagName = release.tag_name || '';
            const releaseName = release.name || '';
            const releaseUrl = release.html_url || '';
            const repo = context.repo;

            const prNumbers = [...releaseBody.matchAll(/#(\d+)/g)]
              .map(m => parseInt(m[1]));

            const prDetails = await Promise.all(
              prNumbers.map(async (num) => {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: repo.owner,
                    repo: repo.repo,
                    pull_number: num
                  });
                  return {
                    number: num,
                    title: pr.title,
                    body: pr.body || ''
                  };
                } catch (e) {
                  return null;
                }
              })
            );

            const validPRs = prDetails.filter(Boolean);
            const prText = validPRs.length > 0
              ? validPRs.map(pr => `PR #${pr.number}: ${pr.title}\n${pr.body}`).join('\n\n---\n\n')
              : releaseBody || 'No release body was provided for this test run.';

            const prompt = [
              'You are a technical writer creating release notes for a mixed audience: development teams, marketing, sales, and customer support staff.',
              '',
              'Below are the PRs from a GitHub release with their titles and descriptions.',
              'Write a clear, concise bullet point summary from an end-user perspective.',
              '',
              'Guidelines:',
              '- Write in English',
              '- Maximum 6 bullets',
              '- Do not mention PR numbers',
              '- Focus on user-facing changes and business impact',
              '- Skip any changes related to dev/staging/development environment updates, CI/CD pipeline changes, test environment configurations, or internal tooling that does not affect end users',
              '- Use plain language that non-technical readers (marketing, sales, support) can understand — avoid jargon',
              '- If a change affects a specific feature or area, mention it briefly (e.g. "Checkout flow:", "User profile:")',
              '',
              prText
            ].join('\n');

            const aiResponse = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 500,
                messages: [{ role: 'user', content: prompt }]
              })
            });

            const aiData = await aiResponse.json();
            const summary = aiData.content[0].text;

            core.setOutput('summary', summary);
            core.setOutput('release_name', releaseName || tagName || 'Test release');
            core.setOutput('release_url', releaseUrl || '');

      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Release summary - ${{ steps.summary.outputs.release_name }}
          to: ${{ secrets.RELEASE_SUMMARY_EMAIL_TO }}
          from: ${{ secrets.GMAIL_ADDRESS }}
          body: |
            ${{ steps.summary.outputs.summary }}

            ${{ steps.summary.outputs.release_url && format('Release link: {0}', steps.summary.outputs.release_url) || '' }}