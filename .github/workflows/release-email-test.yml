name: Test Release Email

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release name to include in the test email
        required: false
        type: string
      tag_name:
        description: Tag name to include in the test email
        required: false
        type: string
      release_url:
        description: Release URL to include in the test email
        required: false
        type: string
      release_body:
        description: Release body or PR references to summarize in the test email
        required: false
        type: string
      email_to:
        description: Destination email address for the test message
        required: true
        type: string

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AI summary
        id: summary
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const manualReleaseName = core.getInput('release_name') || '';
            const manualTagName = core.getInput('tag_name') || '';
            const manualReleaseUrl = core.getInput('release_url') || '';
            const manualReleaseBody = core.getInput('release_body') || '';

            const release = context.payload.release || {};
            const releaseBody = release.body || manualReleaseBody;
            const tagName = release.tag_name || manualTagName;
            const releaseName = release.name || manualReleaseName;
            const releaseUrl = release.html_url || manualReleaseUrl;
            const repo = context.repo;

            const prNumbers = [...releaseBody.matchAll(/#(\d+)/g)]
              .map(m => parseInt(m[1]));

            const prDetails = await Promise.all(
              prNumbers.map(async (num) => {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: repo.owner,
                    repo: repo.repo,
                    pull_number: num
                  });
                  return {
                    number: num,
                    title: pr.title,
                    body: pr.body || ''
                  };
                } catch (e) {
                  return null;
                }
              })
            );

            const validPRs = prDetails.filter(Boolean);
            const prText = validPRs.length > 0
              ? validPRs.map(pr => `PR #${pr.number}: ${pr.title}\n${pr.body}`).join('\n\n---\n\n')
              : releaseBody || 'No release body was provided for this test run.';

            const prompt = [
              'You are a technical writer creating release notes for a mixed audience: development teams, marketing, sales, and customer support staff.',
              '',
              'Below are the PRs from a GitHub release with their titles and descriptions.',
              'Write a clear, concise bullet point summary from an end-user perspective.',
              '',
              'Guidelines:',
              '- Write in English',
              '- Maximum 6 bullets',
              '- Do not mention PR numbers',
              '- Focus on user-facing changes and business impact',
              '- Skip any changes related to dev/staging/development environment updates, CI/CD pipeline changes, test environment configurations, or internal tooling that does not affect end users',
              '- Use plain language that non-technical readers (marketing, sales, support) can understand — avoid jargon',
              '- If a change affects a specific feature or area, mention it briefly (e.g. "Checkout flow:", "User profile:")',
              '',
              prText
            ].join('\n');

            const aiResponse = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + process.env.GEMINI_API_KEY, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                generationConfig: {
                  maxOutputTokens: 500,
                  temperature: 0.3
                },
                contents: [
                  {
                    role: 'user',
                    parts: [{ text: prompt }]
                  }
                ]
              })
            });

            const aiData = await aiResponse.json();
            const summary = aiData?.candidates?.[0]?.content?.parts
              ?.map(part => part.text || '')
              .join('\n')
              .trim();

            if (!summary) {
              core.setFailed(`Gemini did not return a summary. Response: ${JSON.stringify(aiData).slice(0, 1200)}`);
              return;
            }

            core.setOutput('summary', summary);
            core.setOutput('release_name', releaseName || tagName || 'Test release');
            core.setOutput('release_url', releaseUrl || '');

      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Release summary test - ${{ steps.summary.outputs.release_name }}
          to: ${{ github.event.inputs.email_to }}
          from: ${{ secrets.GMAIL_ADDRESS }}
          body: |
            ${{ steps.summary.outputs.summary }}

            ${{ steps.summary.outputs.release_url && format('Release link: {0}', steps.summary.outputs.release_url) || '' }}